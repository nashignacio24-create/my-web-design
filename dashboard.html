<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f5f8ff;
            background: linear-gradient(135deg, #030712, #10245a, #35166b);
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 40px 25px;
            text-align: center;
            border: 1px solid rgba(111, 157, 255, 0.3);
            border-radius: 24px;
            background: rgba(8, 18, 46, 0.9);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #36d7ff;
        }

        p {
            color: #a6b5d4;
            line-height: 1.8;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            border: 0;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(100deg, #18baff, #7045ff);
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="icon">🎉</div>

        <h1>Welcome to Your Dashboard!</h1>

        <p>
            Login successful! You are now on the
            dashboard of My Web Design &amp; Development Website.
        </p>

        <p>You have successfully completed the login demo.</p>

        <button onclick="window.location.href='index.html'">
            LOG OUT
        </button>
    </main>

</body>
</html>
